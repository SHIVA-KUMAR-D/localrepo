<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Quiz</title>
  <style>
    body {
      font-family: Arial;
      background-color: #f5f6ff;
      padding: 20px;
    }
    h1 {
      text-align: center;
      color: #333;
    }
    .question {
      background: #fff;
      border: 1px solid #ccc;
      border-radius: 10px;
      padding: 15px;
      margin: 15px 0;
    }
    .options {
      margin-top: 10px;
    }
    .options label {
      display: block;
      margin-bottom: 5px;
    }
    .buttons {
      text-align: center;
      margin-top: 20px;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      margin: 5px;
    }
  </style>
</head>
<body>

  <h1 id="quizTitle">Quiz</h1>
  <div id="quizContainer"></div>
  <div class="buttons">
    <button onclick="submitQuiz()">Submit</button>
    <button onclick="goBack()">Back</button>
  </div>

  <script src="questions.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const lang = params.get("lang");
    const topic = params.get("topic");

    document.getElementById("quizTitle").innerText = `${lang} - ${topic} Quiz`;

    const quizContainer = document.getElementById("quizContainer");
    const questions = questionBank[lang]?.[topic] || [];

    function loadQuiz() {
      if (questions.length === 0) {
        quizContainer.innerHTML = "<p>No questions found!</p>";
        return;
      }

      questions.slice(0, 10).forEach((q, index) => {
        const questionDiv = document.createElement("div");
        questionDiv.className = "question";
        questionDiv.innerHTML = `
          <strong>Q${index + 1}:</strong> ${q.question}
          <div class="options">
            ${q.options.map((opt, i) => `
              <label>
                <input type="radio" name="q${index}" value="${opt}" /> ${opt}
              </label>
            `).join("")}
          </div>
        `;
        quizContainer.appendChild(questionDiv);
      });
    }

    function submitQuiz() {
      let score = 0;
      questions.slice(0, 10).forEach((q, i) => {
        const selected = document.querySelector(`input[name="q${i}"]:checked`);
        if (selected && selected.value === q.answer) score++;
      });
      alert(`You scored ${score}/10`);
    }

    function goBack() {
      window.history.back();
    }

    loadQuiz();
  </script>
</body>
</html>
